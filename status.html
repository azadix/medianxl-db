<!DOCTYPE html>
<html lang="en" class="has-navbar-fixed-top">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status - MedianDB</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.1/css/bulma.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .progress-container {
            position: relative;
        }
        .overlay-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }
        .overlay-progress::-webkit-progress-bar {
            background-color: transparent;
        }
    </style>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
    <script src="utils.js" type="module"></script>
    <script src="version-config.js" type="module"></script>
    <script src="status.js" type="module" defer></script>
</head>
<body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="./" id="nav-all-skills">
                    <strong>Skills</strong>
                </a>
                <a class="navbar-item" href="./tree.html" id="nav-tree">
                    <strong>Planner</strong>
                </a>
                <a class="navbar-item is-selected" href="./status.html" id="nav-status">
                    <strong>Status</strong>
                </a>
                <a class="navbar-item" href="./edit.html" id="nav-db" style="display: none;">
                    <strong>Editor</strong>
                </a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <div class="field is-horizontal is-align-items-center">
                        <div class="field-label">
                            <label class="label">Version:</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="control">
                                    <div class="select">
                                        <select id="version-selector">
                                            <!-- Populated by JavaScript -->
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <script type="module">
        import { isLocalhost } from './utils.js';
        import { initializeVersionSelector } from './version-config.js';
        
        // Show edit panel only on localhost/local development
        if (isLocalhost()) {
            document.getElementById('nav-db').style.display = '';
        }
        
        // Initialize version selector
        initializeVersionSelector(document.getElementById('version-selector'));
        
        // Navbar burger toggle
        document.addEventListener('DOMContentLoaded', () => {
            const burger = document.querySelector('.navbar-burger');
            const menu = document.querySelector('.navbar-menu');
            
            burger?.addEventListener('click', () => {
                burger.classList.toggle('is-active');
                menu.classList.toggle('is-active');
            });
        });
    </script>

    <div class="container">
        <h2 class="title mt-1 mb-2" id="page-title">Skills Completion Status</h2>
        <div id="content">
            <!-- Content will be dynamically loaded here -->
        </div>
    </div>
</body>
</html>
