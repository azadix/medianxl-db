        // Helper functions for arrow direction calculation
        function getArrowDirection(row, col, skillsInTab) {
            // Look for skills with prerequisites in the current tab
            const skillsWithPrereqs = skillsInTab.filter(skill => 
                skill.prerequisites && skill.prerequisites.length > 0
            );

            for (const skill of skillsWithPrereqs) {
                // Check if this empty position is between a prerequisite skill and the dependent skill
                for (const prereq of skill.prerequisites) {
                    const [type, value, target] = prereq.split(':');
                    
                    if (type === 'skill_level' && target) {
                        // Find the prerequisite skill in the same tab
                        const prereqSkill = skillsInTab.find(s => s.name === target);
                        if (prereqSkill) {
                            // Check if this empty position is on the path between them
                            const direction = getDirectionBetweenSkills(prereqSkill, skill, row, col);
                            if (direction) return direction;
                        }
                    }
                }
            }
            return null;
        }

        function getDirectionBetweenSkills(fromSkill, toSkill, emptyRow, emptyCol) {
            const fromRow = fromSkill.row;
            const fromCol = fromSkill.col;
            const toRow = toSkill.row;
            const toCol = toSkill.col;

            // Check if empty position is on a direct line between the skills
            if (fromRow === toRow) {
                // Horizontal line
                if (emptyRow === fromRow && 
                    ((fromCol < emptyCol && emptyCol < toCol) || (toCol < emptyCol && emptyCol < fromCol))) {
                    return fromCol < toCol ? 'right' : 'left';
                }
            } else if (fromCol === toCol) {
                // Vertical line
                if (emptyCol === fromCol && 
                    ((fromRow < emptyRow && emptyRow < toRow) || (toRow < emptyRow && emptyRow < fromRow))) {
                    return fromRow < toRow ? 'down' : 'up';
                }
            } else {
                // Diagonal line - check if empty position is on the path
                const rowDiff = toRow - fromRow;
                const colDiff = toCol - fromCol;
                const steps = Math.max(Math.abs(rowDiff), Math.abs(colDiff));
                
                for (let i = 1; i < steps; i++) {
                    const checkRow = fromRow + Math.round((rowDiff * i) / steps);
                    const checkCol = fromCol + Math.round((colDiff * i) / steps);
                    
                    if (checkRow === emptyRow && checkCol === emptyCol) {
                        // Determine diagonal direction
                        if (rowDiff > 0 && colDiff > 0) return 'down-right';
                        if (rowDiff > 0 && colDiff < 0) return 'down-left';
                        if (rowDiff < 0 && colDiff > 0) return 'up-right';
                        if (rowDiff < 0 && colDiff < 0) return 'up-left';
                    }
                }
            }
            return null;
        }

        function getArrowSymbol(direction) {
            const arrows = {
                'up': '↑',
                'down': '↓',
                'left': '←',
                'right': '→',
                'up-right': '↗',
                'up-left': '↖',
                'down-right': '↘',
                'down-left': '↙'
            };
            return arrows[direction] || '→';
        }

        function addOverlayArrows(contentDiv, skillsInTab, minRow, minCol) {
            // Find skills with prerequisites
            const skillsWithPrereqs = skillsInTab.filter(skill => 
                skill.prerequisites && skill.prerequisites.length > 0
            );

            skillsWithPrereqs.forEach(skill => {
                skill.prerequisites.forEach(prereq => {
                    const [type, value, target] = prereq.split(':');
                    
                    if (type === 'skill_level' && target) {
                        // Find the prerequisite skill in the same tab
                        const prereqSkill = skillsInTab.find(s => s.name === target);
                        if (prereqSkill) {
                            createOverlayArrow(contentDiv, prereqSkill, skill, minRow, minCol, skillsInTab);
                        }
                    }
                });
            });
        }

        function createOverlayArrow(contentDiv, fromSkill, toSkill, minRow, minCol, skillsInTab) {
            // Calculate positions relative to the grid
            const fromRow = fromSkill.row - minRow + 1;
            const fromCol = fromSkill.col - minCol + 1;
            const toRow = toSkill.row - minRow + 1;
            const toCol = toSkill.col - minCol + 1;

            console.log(`Creating arrow: ${fromSkill.name}(${fromRow},${fromCol}) → ${toSkill.name}(${toRow},${toCol})`);

            // Find skill cards by looking for elements with the correct grid position
            const allCards = contentDiv.querySelectorAll('.skill-card, .empty-skill-card');
            let fromCard = null;
            let toCard = null;
            
            allCards.forEach(card => {
                // Check if using grid-area format (e.g., "1 / 2")
                const gridArea = card.style.gridArea;
                let gridRow, gridCol;
                
                if (gridArea && gridArea.includes('/')) {
                    const parts = gridArea.split('/');
                    gridRow = parseInt(parts[0].trim());
                    gridCol = parseInt(parts[1].trim());
                } else {
                    // Fallback to grid-row and grid-column
                    gridRow = parseInt(card.style.gridRow);
                    gridCol = parseInt(card.style.gridColumn);
                }
                
                if (gridRow === fromRow && gridCol === fromCol) {
                    fromCard = card;
                }
                if (gridRow === toRow && gridCol === toCol) {
                    toCard = card;
                }
            });
            
            console.log('From card found:', fromCard);
            console.log('To card found:', toCard);
            console.log('All cards:', allCards.length);
            
            if (!fromCard || !toCard) {
                console.log('Cards not found, skipping arrow');
                return;
            }
            
            // Get the actual positions of the skill cards
            const fromRect = fromCard.getBoundingClientRect();
            const toRect = toCard.getBoundingClientRect();
            const gridRect = contentDiv.getBoundingClientRect();
            
            console.log('From rect:', fromRect);
            console.log('To rect:', toRect);
            console.log('Grid rect:', gridRect);
            
            // Calculate center positions relative to the grid container
            const fromX = fromRect.left + fromRect.width / 2 - gridRect.left;
            const fromY = fromRect.top + fromRect.height / 2 - gridRect.top;
            const toX = toRect.left + toRect.width / 2 - gridRect.left;
            const toY = toRect.top + toRect.height / 2 - gridRect.top;
            
            console.log('Calculated positions:', {fromX, fromY, toX, toY});

            // Calculate arrow direction and position
            const deltaX = toX - fromX;
            const deltaY = toY - fromY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            console.log('Distance calculated:', distance);
            
            // Only show arrow if skills are reasonably close (not too far apart)
            if (distance > 500) {
                console.log('Arrow skipped - distance too far:', distance);
                return; // Skip very long arrows
            }
            
            // Calculate arrow position (midpoint between skills)
            const arrowX = (fromX + toX) / 2;
            const arrowY = (fromY + toY) / 2;
            
            // Calculate rotation angle (point from prerequisite to dependent skill)
            const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
            
            // Create SVG line with arrowhead
            const arrow = document.createElement('div');
            arrow.className = 'overlay-arrow';
            arrow.style.position = 'absolute';
            arrow.style.left = '0';
            arrow.style.top = '0';
            arrow.style.width = '100%';
            arrow.style.height = '100%';
            arrow.style.pointerEvents = 'none';
            arrow.style.zIndex = '10';

            // Create SVG element
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.width = '100%';
            svg.style.height = '100%';
            svg.style.position = 'absolute';
            svg.style.left = '0';
            svg.style.top = '0';

            // Calculate intersection points with card edges
            const cardWidth = 210;
            const cardHeight = 105;
            const halfWidth = cardWidth / 2;
            const halfHeight = cardHeight / 2;

            // Calculate direction vector
            const dx = toX - fromX;
            const dy = toY - fromY;
            const length = Math.sqrt(dx * dx + dy * dy);
            const unitX = dx / length;
            const unitY = dy / length;

            // Find intersection points with card boundaries
            function getIntersectionPoint(centerX, centerY, targetX, targetY, cardWidth, cardHeight) {
                const dx = targetX - centerX;
                const dy = targetY - centerY;
                const length = Math.sqrt(dx * dx + dy * dy);
                const unitX = dx / length;
                const unitY = dy / length;

                // Calculate intersection with card rectangle
                const halfW = cardWidth / 2;
                const halfH = cardHeight / 2;

                // Check intersections with each edge
                const intersections = [];

                // Top edge
                if (unitY !== 0) {
                    const t = (centerY - halfH - centerY) / unitY;
                    const x = centerX + t * unitX;
                    if (x >= centerX - halfW && x <= centerX + halfW && t > 0) {
                        intersections.push({ x, y: centerY - halfH, t });
                    }
                }

                // Bottom edge
                if (unitY !== 0) {
                    const t = (centerY + halfH - centerY) / unitY;
                    const x = centerX + t * unitX;
                    if (x >= centerX - halfW && x <= centerX + halfW && t > 0) {
                        intersections.push({ x, y: centerY + halfH, t });
                    }
                }

                // Left edge
                if (unitX !== 0) {
                    const t = (centerX - halfW - centerX) / unitX;
                    const y = centerY + t * unitY;
                    if (y >= centerY - halfH && y <= centerY + halfH && t > 0) {
                        intersections.push({ x: centerX - halfW, y, t });
                    }
                }

                // Right edge
                if (unitX !== 0) {
                    const t = (centerX + halfW - centerX) / unitX;
                    const y = centerY + t * unitY;
                    if (y >= centerY - halfH && y <= centerY + halfH && t > 0) {
                        intersections.push({ x: centerX + halfW, y, t });
                    }
                }

                // Return the closest intersection point
                if (intersections.length > 0) {
                    const closest = intersections.reduce((min, curr) => curr.t < min.t ? curr : min);
                    return { x: closest.x, y: closest.y };
                }

                return { x: centerX, y: centerY }; // Fallback to center
            }

            const startPoint = getIntersectionPoint(fromX, fromY, toX, toY, cardWidth, cardHeight);
            const endPoint = getIntersectionPoint(toX, toY, fromX, fromY, cardWidth, cardHeight);

            const startX = startPoint.x;
            const startY = startPoint.y;
            const endX = endPoint.x;
            const endY = endPoint.y;

            // Create line
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', startX);
            line.setAttribute('y1', startY);
            line.setAttribute('x2', endX);
            line.setAttribute('y2', endY);
            line.setAttribute('stroke', '#8a8a8a');
            line.setAttribute('stroke-width', '2.25');
            line.setAttribute('stroke-linecap', 'round');

            // Create arrowhead marker
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
            marker.setAttribute('id', `arrowhead-${Date.now()}-${Math.random()}`);
            marker.setAttribute('markerWidth', '7.5');
            marker.setAttribute('markerHeight', '5.25');
            marker.setAttribute('refX', '6.75');
            marker.setAttribute('refY', '2.625');
            marker.setAttribute('orient', 'auto');

            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            polygon.setAttribute('points', '0 0, 7.5 2.625, 0 5.25');
            polygon.setAttribute('fill', '#8a8a8a');

            marker.appendChild(polygon);
            defs.appendChild(marker);
            svg.appendChild(defs);

            // Add arrowhead to line
            line.setAttribute('marker-end', `url(#${marker.getAttribute('id')})`);

            svg.appendChild(line);
            arrow.appendChild(svg);

            contentDiv.appendChild(arrow);
            console.log('Arrow added to DOM:', arrow);
        }

        async function loadSkillsFromSQLite() {
            try {
                // Fetch SQLite file
                const response = await fetch('skills.sqlite');
                if (!response.ok) throw new Error('Failed to load SQLite file');

                const buffer = await response.arrayBuffer();

                // Initialize SQL.js
                const SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/${file}` });
                const db = new SQL.Database(new Uint8Array(buffer));

                // Query skills with correct tab join
                const stmt = db.prepare(`
                    SELECT s.*,
                        ct.name AS tab_name,
                        c.name AS class_name,
                        s.description,
                        GROUP_CONCAT(t.name, ', ') AS tags,
                        sml.base_max_level,
                        sml.can_be_enhanced,
                        sml.can_add_points,
                        GROUP_CONCAT(sp.requirement_type || ':' || sp.requirement_value || ':' || COALESCE(ts.display_name, ct2.name, ''), '; ') AS prerequisites
                    FROM skills s
                    LEFT JOIN classTabs ct
                        ON s.tab_index = ct.id
                    LEFT JOIN classes c
                        ON s.class_id = c.id
                    LEFT JOIN skill_skilltags st
                        ON s.id = st.skill_id
                    LEFT JOIN skilltags t
                        ON st.tag_id = t.id
                    LEFT JOIN skill_max_levels sml
                        ON s.id = sml.skill_id
                    LEFT JOIN skill_prerequisites sp
                        ON s.id = sp.skill_id
                    LEFT JOIN skills ts
                        ON sp.target_skill_id = ts.id
                    LEFT JOIN classTabs ct2
                        ON sp.target_tab_id = ct2.id
                    WHERE s.class_id != 1
                    GROUP BY s.id
                    ORDER BY s.class_id, s.tab_index, s.row, s.col;
                `);

                const loadedSkills = [];
                while (stmt.step()) {
                    const row = stmt.getAsObject();
                    loadedSkills.push({
                        id: row.name,
                        name: row.display_name,
                        class: row.class_name || '',
                        tab: row.tab_index,        // numeric
                        tabName: row.tab_name || '', // proper tab name
                        tags: row.tags ? row.tags.split(', ') : [],
                        row: row.row,
                        col: row.col,
                        image: row.image || 'icons-shared_missing.png',
                        hasDetails: row.description && row.description.trim().length > 0,
                        baseMaxLevel: row.base_max_level || 0,
                        canBeEnhanced: row.can_be_enhanced === 1,
                        canAddPoints: row.can_add_points === 1,
                        prerequisites: row.prerequisites ? row.prerequisites.split('; ').filter(p => p.trim()) : []
                    });


                }
                stmt.free();

                // Generalize Mastery tab replication: copy any tab named "Mastery" to classes missing it
                const masteryByClass = new Map();
                loadedSkills.forEach(s => {
                    if (s.tabName === 'Mastery') {
                        masteryByClass.set(s.class, true);
                    }
                });

                const masterySkills = loadedSkills.filter(s => s.tabName === 'Mastery');
                const allClasses = [...new Set(loadedSkills.map(s => s.class))];
                const prototypeClass = masterySkills.length > 0 ? masterySkills[0].class : null;
                if (prototypeClass) {
                    allClasses.forEach(cls => {
                        if (!masteryByClass.get(cls)) {
                            masterySkills.forEach(skill => {
                                loadedSkills.push({
                                    ...skill,
                                    class: cls
                                });
                            });
                        }
                    });
                }

            // Generalize Paragon of Fate replication: copy to all classes
            const paragonSkills = loadedSkills.filter(s => s.id === 'paragon_of_fate');
            if (paragonSkills.length > 0) {
                const paragonByClass = new Map();
                paragonSkills.forEach(s => {
                    paragonByClass.set(s.class, true);
                });

                allClasses.forEach(cls => {
                    if (!paragonByClass.get(cls)) {
                        paragonSkills.forEach(skill => {
                            loadedSkills.push({
                                ...skill,
                                class: cls
                            });
                        });
                    }
                });
            }


                return loadedSkills; // update global list
            } catch (error) {
                console.error('Error loading skills from SQLite:', error);
            }
        }

        // Main render function
        function renderSkills(selectedClass) {
            skillsContainer.innerHTML = "";

            // Filter skills for this class
            const classSkills = skillsList.filter(skill => skill.class === selectedClass);

            // Group by tabName
            const tabs = {};
            classSkills.forEach(skill => {
                if (!tabs[skill.tabName]) tabs[skill.tabName] = [];
                tabs[skill.tabName].push(skill);
            });

            // Sort tabs with Mastery positioned 3rd from the end
            const tabNames = Object.keys(tabs);
            const sortedTabNames = tabNames.sort((a, b) => {
                // Define the special tabs that should be at the end
                const specialTabs = ['Mastery', 'Reward', 'Innate'];
                
                const aIsSpecial = specialTabs.includes(a);
                const bIsSpecial = specialTabs.includes(b);
                
                // If both are special tabs, sort by their position in the specialTabs array
                if (aIsSpecial && bIsSpecial) {
                    return specialTabs.indexOf(a) - specialTabs.indexOf(b);
                }
                
                // If only one is special, put it at the end
                if (aIsSpecial) return 1;
                if (bIsSpecial) return -1;
                
                // If neither is special, maintain original order (don't sort alphabetically)
                return 0;
            });

            // Tabs nav
            const tabNav = document.createElement('div');
            tabNav.className = 'tabs';
            const ul = document.createElement('ul');

            const tabContent = document.createElement('div');
            let first = true;

            sortedTabNames.forEach(tabName => {
                // Tab nav button
                const li = document.createElement('li');
                if (first) li.classList.add('is-active');
                const a = document.createElement('a');
                a.textContent = tabName;
                a.dataset.tab = tabName;
                li.appendChild(a);
                ul.appendChild(li);

                // Tab content grid
                const contentDiv = document.createElement('div');
                contentDiv.className = 'skills-grid';
                contentDiv.id = `tab-${tabName}`;
                contentDiv.style.display = first ? 'grid' : 'none';

                const rows = tabs[tabName].map(s => s.row);
                const cols = tabs[tabName].map(s => s.col);
                const minRow = Math.min(...rows);
                const maxRow = Math.max(...rows);
                const minCol = Math.min(...cols);
                const maxCol = Math.max(...cols);

                contentDiv.style.gridTemplateRows = `repeat(${maxRow - minRow + 1}, auto)`;
                contentDiv.style.gridTemplateColumns = `repeat(${maxCol - minCol + 1}, 1fr)`;

                const skillsInTab = tabs[tabName]; // Define skillsInTab for arrow calculations

                for (let r = minRow; r <= maxRow; r++) {
                    for (let c = minCol; c <= maxCol; c++) {
                        const skill = tabs[tabName].find(s => s.row === r && s.col === c);
                        if (skill) {
                            const card = document.createElement('div');
                            card.className = 'skill-card';
                            card.style.gridRow = r - minRow + 1;
                            card.style.gridColumn = c - minCol + 1;

                            // Parse prerequisites to find level requirements
                            let levelRequirement = null;
                            let hasPrerequisites = false;
                            if (skill.prerequisites && skill.prerequisites.length > 0) {
                                hasPrerequisites = true;
                                skill.prerequisites.forEach(prereq => {
                                    const [type, value, target] = prereq.split(':');
                                    if (type === 'character_level' || type === 'class_level') {
                                        levelRequirement = value;
                                    }
                                });
                            }

                            let cardText = `
                                ${getSkillIconHTML(skill.image, skill.class)}
                                <div>
                            `;
                            if (skill.hasDetails) {
                                cardText += `<a href="./?skill=${skill.id}">${skill.name}</a>`;
                            } else {
                                cardText += `${skill.name}`;
                            }
                            cardText += `</div>`;
                            
                            // Add level requirement at top right if present
                            if (levelRequirement) {
                                cardText += `<div class="has-text-danger is-size-7" style="position: absolute; top: 2px; right: 2px;">Lv.${levelRequirement}</div>`;
                            }
                            
                            // Add skill level info under skill name (orange value if skill reached max possible level)
                            if (skill.canAddPoints) {
                                // Regular skills that can have points added
                                if (skill.canBeEnhanced) {
                                    cardText += `<div class="has-text-grey is-size-6">0 / ${skill.baseMaxLevel}</div>`;
                                } else {
                                    cardText += `<div class="has-text-grey is-size-6">0 / <span class="has-text-warning">${skill.baseMaxLevel}</span></div>`;
                                }
                            } else {
                                // Skills that cannot have points added
                                if (skill.tabName == "Innate") {
                                    cardText += `<div class="has-text-grey is-size-6">0 / 0</div>`;
                                } else {
                                    cardText += `<div class="has-text-grey is-size-6">? / ?</div>`;
                                }
                            }
                            
                            card.innerHTML = cardText;

                            contentDiv.appendChild(card);
                        } else {
                            const placeholder = document.createElement('div');
                            placeholder.className = 'empty-skill-card';
                            placeholder.style.gridRow = r - minRow + 1;
                            placeholder.style.gridColumn = c - minCol + 1;
                            contentDiv.appendChild(placeholder);
                        }
                    }
                }

                tabContent.appendChild(contentDiv);
                
                // Only add arrows for the first (active) tab initially
                if (first) {
                    setTimeout(() => {
                        addOverlayArrows(contentDiv, skillsInTab, minRow, minCol);
                    }, 100);
                }
                
                first = false;
            });

            tabNav.appendChild(ul);
            skillsContainer.appendChild(tabNav);
            skillsContainer.appendChild(tabContent);

            // Add tab switching functionality
            ul.addEventListener('click', (e) => {
                if (e.target.tagName === 'A') {
                    const clickedTab = e.target.dataset.tab;
                    
                    // Remove active class from all tabs
                    ul.querySelectorAll('li').forEach(li => li.classList.remove('is-active'));
                    e.target.parentElement.classList.add('is-active');
                    
                    // Hide all tab contents
                    document.querySelectorAll('.skills-grid').forEach(grid => {
                        grid.style.display = 'none';
                    });
                    
                    // Show clicked tab content
                    const targetGrid = document.getElementById(`tab-${clickedTab}`);
                    if (targetGrid) {
                        targetGrid.style.display = 'grid';
                        
                        // Clear existing arrows and recreate them for the active tab
                        targetGrid.querySelectorAll('.overlay-arrow').forEach(arrow => arrow.remove());
                        
                        // Find the skills for this tab and recreate arrows
                        const tabSkills = skillsList.filter(skill => skill.tabName === clickedTab);
                        if (tabSkills.length > 0) {
                            const rows = tabSkills.map(s => s.row);
                            const cols = tabSkills.map(s => s.col);
                            const minRow = Math.min(...rows);
                            const minCol = Math.min(...cols);
                            
                            setTimeout(() => {
                                addOverlayArrows(targetGrid, tabSkills, minRow, minCol);
                            }, 50);
                        }
                    }
                }
            });

        }

        // Initial render
        async function main() {
            skillsList = await loadSkillsFromSQLite(); // this updates global skillsList

            // Populate selector
            const classes = [...new Set(skillsList.map(skill => skill.class))];
            classes.forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = cls;
                classSelect.appendChild(opt);
            });

            renderSkills(classes[0]);
            classSelect.addEventListener('change', () => renderSkills(classSelect.value));

        }
        main();
    </script>
</body>
</html>
