<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planner - MedianDB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.1/css/bulma.min.css" />
  <link rel="stylesheet" href="tree/tree-styles.css">
  <link rel="stylesheet" href="edit/dropdown-style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
  <script src="utils.js" type="module"></script>
</head>
<body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>
        <div class="navbar-menu">
        <div class="navbar-start">
            <a class="navbar-item" href="./" id="nav-all-skills">
                <strong>Skills</strong>
            </a>
            <a class="navbar-item is-selected" href="./tree.html" id="nav-tree">
                <strong>Planner</strong>
            </a>
            <a class="navbar-item" href="./edit.html" id="nav-db" style="display: none;">
                <strong>Editor</strong>
            </a>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <div class="field is-horizontal is-align-items-center">
                    <div class="field-label">
                        <label class="label">Version:</label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <div class="control">
                                <div class="select">
                                    <select id="version-selector">
                                        <!-- Populated by JavaScript -->
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </nav>
    <div class="section px-5">
        <!-- Initial Menu Section -->
        <section id="menu-section" style="display: block;">
            <div class="container" style="max-width: 600px; margin-top: 10vh;">               
                <div class="buttons is-flex is-flex-direction-column">
                    <button class="button is-large is-fullwidth" id="menuNewBuildBtn">
                        <span class="icon-text">
                            <span>New Build</span>
                        </span>
                    </button>
                    
                    <button class="button is-large is-fullwidth" id="menuLoadBuildBtn">
                        <span class="icon-text">
                            <span>Load Build</span>
                        </span>
                    </button>
                    
                    <button class="button is-large is-fullwidth" id="menuEditDefaultsBtn">
                        <span class="icon-text">
                            <span>Edit defaults</span>
                        </span>
                    </button>
                </div>
            </div>
        </section>
        
        <!-- Tree View Section -->
        <section id="tree-section" style="display: none;">
            <div class="columns pt-3" style="height: 95vh;">
                <div class="column is-one-fifth px-0" style="overflow-y: auto;">
                    <div class="pr-2" style="height: 100%; border-right: 1px solid var(--bulma-border);">
                        <div class="field mb-4">
                            <div class="buttons has-addons is-fullwidth">
                                <button class="button is-light is-outlined" id="backToMenuBtn" style="flex: 1;">
                                    ← Menu
                                </button>
                                <button class="button is-success is-outlined" id="saveBuildBtn" style="flex: 1; display: none;">
                                    Save
                                </button>
                                <button class="button is-success is-outlined" id="saveAsBuildBtn" style="flex: 1;">
                                    Save As
                                </button>
                                <button class="button is-danger is-outlined" id="resetBuildBtn" style="flex: 1;">
                                    Reset
                                </button>
                            </div>
                        </div>

                        <h3 class="title is-5 mb-3">Character Info</h3>
                        
                        <div class="field" id="minLevelField">
                            <p>
                                <span id="minLevelDisplay" class="has-text-warning has-text-weight-bold">
                                    Level 1
                                </span>
                                <span class="tooltip has-text-grey-light is-size-7" id="minLevelBreakdown">
                                    (Base points: 0 + Quest points: 0)
                                </span>
                            </p>
                            <p class="help is-size-6" id="minLevelHelp">
                                Minimum level needed for current skill allocation
                            </p>
                            <hr class="my-1">
                        </div>
                        
                        <div class="field">
                            <label class="label">Class</label>
                            <div class="control">
                                <div class="select is-fullwidth">
                                    <select id="classSelect"></select>
                                </div>
                            </div>
                            <hr class="my-1">
                        </div>

                        
                        <div class="field" id="devotionField" style="display: none;">
                            <label class="label">Devotion</label>
                            <div class="box has-background-dark p-2">
                                <p id="devotionDisplay" class="has-text-centered has-text-weight-bold">
                                    None
                                </p>
                            </div>
                            <hr class="my-1">
                        </div>
                        
                        <div id="oskillPanel" style="display: none;">
                            <div class="field">
                                <label class="label">Add an oSkill</label>
                                <div id="oskill-dropdown" class="oskill-dropdown-wrapper"></div>
                                <input type="hidden" id="oskill-hidden" />
                            </div>
                            <hr class="my-1">
                        </div>
                    </div>
                </div>
                
                <div class="column" style="overflow-y: auto; overflow-x: hidden; position: relative;">
                    <div id="skillsContainer"></div>
                </div>
            </div>
        </section>
        
        <!-- Load Build Section -->
        <section id="load-section" style="display: none;">
            <div class="container" style="margin-top: 5vh;">
                <div class="field mb-4">
                    <button class="button is-light is-outlined" id="backToMenuFromLoadBtn">
                        ← Back to Menu
                    </button>
                </div>
                
                <h2 class="title is-3">Load Build</h2>
                
                <div id="saved-builds-list">
                    <p class="has-text-grey-light">No saved builds found</p>
                </div>
            </div>
        </section>
        
        <!-- Edit Defaults Section -->
        <section id="defaults-section" style="display: none;">
            <div class="container" style="max-width: 50%; margin-top: 5vh;">
                <div class="field mb-4">
                    <button class="button is-light is-outlined" id="backToMenuFromDefaultsBtn">
                        ← Back to Menu
                    </button>
                </div>
                
                <h2 class="title is-3">Default Settings</h2>
                
                <div class="box">
                    
                    <div class="field">
                        <label class="label">Difficulty Progress</label>
                        <div class="field">
                            <label class="checkbox">
                                <input type="checkbox" id="normalCompleted">
                                Normal Completed
                            </label>
                        </div>
                        <div class="field">
                            <label class="checkbox">
                                <input type="checkbox" id="nightmareCompleted">
                                Nightmare Completed
                            </label>
                        </div>
                        <div class="field">
                            <label class="checkbox">
                                <input type="checkbox" id="hellCompleted">
                                Hell Completed
                            </label>
                        </div>
                    </div>
                    <div class="buttons is-flex is-justify-content-space-between">
                        <button class="button is-success is-outlined" id="saveDefaultsBtn">
                            Save Defaults
                        </button>
                        <button class="button is-danger is-outlined" id="resetDefaultsBtn">
                            Reset to Defaults
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script type="module">
        import { initializeTreePage } from './tree/tree-core.js';
        import { isLocalhost } from './utils.js';
        import { initializeVersionSelector } from './version-config.js';

        // Show edit panel only on localhost/local development
        if (isLocalhost()) {
            document.getElementById('nav-db').style.display = '';
        }

        // Initialize version selector
        initializeVersionSelector(document.getElementById('version-selector'));

        document.addEventListener('DOMContentLoaded', () => {
            // Navbar burger toggle
            const burger = document.querySelector('.navbar-burger');
            const menu = document.querySelector('.navbar-menu');
            
            burger?.addEventListener('click', () => {
                burger.classList.toggle('is-active');
                menu.classList.toggle('is-active');
            });
            
            initializeTreePage();
        });
    </script>
</body>
</html>
